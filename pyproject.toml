[project]
name = "property-agents"
version = "0.1.0"
description = "Multi-agent and MCP benchmark project for real-estate search across Rio Grande do Norte"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastmcp",
    "numpy",
    "pandas",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest",
    "ruff",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
venvPath = "."
venv = ".venv"
