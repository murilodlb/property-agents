[project]
name = "property-agents"
version = "0.1.0"
description = "Multi-agent and MCP benchmark project for real-estate search across Rio Grande do Norte"
requires-python = ">=3.12"
dependencies = [
    "fastmcp",
    "numpy",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
